services:
  db:
    image: mysql:8.4
    container_name: avorium-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: avorium
      MYSQL_USER: avorium
      MYSQL_PASSWORD: avorium_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - avorium-mysql-data:/var/lib/mysql

volumes:
  avorium-mysql-data:
